version: '3.8'

services:
  # --- INFRASTRUCTURE ---
# Database removed - connecting to local host instance in pgAdmin

  vrom-redis:
    image: redis:7-alpine
    container_name: vrom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vrom-network

  vrom-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vrom-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vrom-network

  vrom-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vrom-kafka
    depends_on:
      - vrom-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: vrom-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://vrom-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - vrom-network

  vrom-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vrom-kafka-ui
    depends_on:
      - vrom-kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: vrom-kafka:29092
    networks:
      - vrom-network

  # --- MICROSERVICES ---
  vrom-matching-engine:
    build:
      context: .
      dockerfile: matching_engine/Dockerfile
    container_name: vrom-matching-engine
    ports:
      - "50051:50051"
    networks:
      - vrom-network

  vrom-ai-service:
    build:
      context: ./ai_service
    container_name: vrom-ai-service
    ports:
      - "50052:50052"
    networks:
      - vrom-network

  vrom-stream-processor:
    build:
      context: ./stream_processor
    container_name: vrom-stream-processor
    depends_on:
      - vrom-kafka
      - vrom-redis
    environment:
      KAFKA_BROKERS: vrom-kafka:29092
      REDIS_HOST: vrom-redis
    networks:
      - vrom-network

  vrom-backend:
    build:
      context: ./backend
    container_name: vrom-backend
    restart: on-failure
    depends_on:
      vrom-redis:
        condition: service_started
      vrom-kafka:
        condition: service_started
      vrom-matching-engine:
        condition: service_started
      vrom-ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:3000/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: vrom-redis:6379
      KAFKA_BROKERS: vrom-kafka:29092
      MATCHING_ENGINE_ADDR: vrom-matching-engine:50051
      AI_SERVICE_ADDR: vrom-ai-service:50052
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    networks:
      - vrom-network

  vrom-admin:
    build:
      context: ./vrom-admin
    container_name: vrom-admin
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    networks:
      - vrom-network

networks:
  vrom-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
